name = "moohsia-cloud"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
GITHUB_REPO = "htw0702tw/htw0702.com"
SEARCH_MONTHLY_BUDGET = "900"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "moohsia-db"
database_id = "c4ae9f3b-7ae1-4b83-aa6c-f7dd7e3ee60e"

[[routes]]
pattern = "api.moohsia.com"
custom_domain = true

[triggers]
crons = ["0 * * * *"]
