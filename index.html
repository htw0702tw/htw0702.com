<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2c"><title>htw0702｜筳筳的世界</title><style>html,body{margin:0;min-height:100%;background:#0e1726;color:#f5f2ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.mark{font-size:42px;margin-bottom:14px}.sub{color:#b5c0cb;font-size:14px}.err{max-width:560px;line-height:1.7}</style></head><body><main class="loading" id="loading"><div><div class="mark">筳</div><div>正在進入筳筳的世界…</div><div class="sub">htw0702.com</div></div></main><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('browser');const files=['app-0.txt','app-1.txt','app-23.txt','app-4.txt','app-5.txt','app-6.txt','app-7.txt'];const parts=await Promise.all(files.map(n=>fetch('/deploy/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div class="err"><div class="mark">筳</div><h1>網站載入失敗</h1><p>請重新整理頁面；若仍無法開啟，請確認瀏覽器已更新到最新版。</p><div class="sub">htw0702.com</div></div>'}})();</script></body></html>
