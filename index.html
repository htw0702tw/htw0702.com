<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141820" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/og.jpg" />
    <link rel="preload" as="image" href="/assets/coast.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap"
    />
    <!--seo-->
    <title>筳筳｜htw0702</title>
    <meta
      name="description"
      content="筳筳的個人世界。來自台灣，把海岸、祭典、夜市與花火做成一座會回應你的網站。"
    />
    <!--/seo-->
    <link rel="stylesheet" href="/assets/world-2026.css" />
    <script>
      document.documentElement.classList.add("js");
      try {
        if (
          matchMedia("(prefers-reduced-motion: reduce)").matches ||
          sessionStorage.getItem("world-boot") === "1"
        )
          document.documentElement.classList.add("booted");
      } catch {}
      setTimeout(() => document.documentElement.classList.add("booted", "show-all"), 2400);
    </script>
    <script type="module" src="/assets/world-2026.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="progress" aria-hidden="true"></div>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <span class="mark">筳</span>
        <strong>筳筳</strong>
        <em>HTW0702</em>
        <i class="boot-bar"></i>
        <span class="boot-hint">點一下進入</span>
      </div>
    </div>
    <div id="spot" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <svg class="grain" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)" />
    </svg>
    <header>
      <a class="brand" href="/tw">
        <span class="mark">筳</span>
        <span class="brand-name">筳筳<small>HTW0702</small></span>
      </a>
      <nav id="nav"></nav>
      <div class="controls">
        <select id="language" aria-label="Language"></select>
        <button id="menu" aria-label="Menu" aria-controls="nav" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
    <main id="main"></main>
    <footer>
      <p class="footer-name">筳筳<span>Wang Hao Ting · htw0702</span></p>
      <p id="peace"></p>
      <div class="footer-links">
        <a href="mailto:taiwan@htw0702.com">taiwan@htw0702.com</a>
        <a href="mailto:japan@htw0702.com">japan@htw0702.com</a>
        <a data-route="social" href="/tw/social">Instagram · Threads · X</a>
        <a data-route="world" href="/tw/world">暮霞世界</a>
        <a data-route="now" href="/tw/now">Now</a>
        <a data-route="plans" href="/tw/plans">Plans</a>
        <a data-route="games/lol" href="/tw/games/lol">League of Legends</a>
      </div>
      <small>© 2026 Wang Hao Ting</small>
    </footer>
    <div class="environment">
      <button id="sound" type="button" aria-pressed="true">♫</button>
      <select id="scene" aria-label="Theme"></select>
      <span id="clock"></span>
    </div>
    <button id="to-top" type="button" aria-label="Back to top">↑</button>
    <noscript>請啟用 JavaScript 以瀏覽互動內容。Please enable JavaScript. JavaScript を有効にしてください。</noscript>
  </body>
</html>
