<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>管理 — htw0702</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="../index.html">HTW<span>0702</span></a>
      <div class="links"><a href="../index.html">回網站</a></div>
    </div>
  </nav>
  <div class="wrap page-title">
    <p class="kicker">Studio</p>
    <h1>寫文章／上傳</h1>
    <p class="lede">文章與圖庫檔案會寫進 GitHub，網站會跟著更新。時間預設台北現在。</p>
  </div>
  <section class="section" style="border-top:0;padding-top:0">
    <div class="wrap admin">
      <label>GitHub token（只要 contents 寫入權限）
        <input id="token" type="password" autocomplete="off" placeholder="ghp_… 或 github_pat_…" />
      </label>
      <button type="button" id="save-token" class="btn">存在這個瀏覽器</button>
      <p class="hint">GitHub → Settings → Developer settings → Fine-grained tokens，只開這個 repo 的 Contents: Read and write。</p>
      <label>標題
        <input id="title" type="text" placeholder="文章標題" />
      </label>
      <label>時間（台北）
        <input id="when" type="datetime-local" />
      </label>
      <button type="button" id="new-time" class="btn ghost">改成現在</button>
      <label>本文
        <textarea id="body" rows="14" placeholder="寫在這裡。上傳的圖片會自動插進來。"></textarea>
      </label>
      <label>上傳圖片或短影片
        <input id="file" type="file" accept="image/*,video/*" />
      </label>
      <div class="btn-row">
        <button type="button" id="upload" class="btn ghost">上傳檔案</button>
        <button type="button" id="publish" class="btn">發布文章</button>
      </div>
      <p id="status" class="hint"></p>
      <h2>已發布</h2>
      <ul id="post-list" class="plain"></ul>
      <h2>圖庫檔案</h2>
      <ul id="media-list" class="plain"></ul>
    </div>
  </section>
  <script src="../js/admin.js"></script>
</body>
</html>
