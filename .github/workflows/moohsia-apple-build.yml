name: MOOHSIA Apple Build

on:
  push:
    branches: [moohsia-dev]
    paths:
      - 'MOOHSIA-Apple/**'
      - '.github/workflows/moohsia-apple-build.yml'
  workflow_dispatch:

jobs:
  cloud-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Worker JavaScript
        run: |
          node --check MOOHSIA-Apple/Cloudflare/src/core.js
          node --check MOOHSIA-Apple/Cloudflare/src/integrations.js
          node --check MOOHSIA-Apple/Cloudflare/src/index.js
      - name: Package Cloud upgrade
        run: |
          chmod +x MOOHSIA-Apple/Upgrade-Cloud-0.4.command
          zip -r MOOHSIA-Cloud-0.4.0.zip MOOHSIA-Apple/Cloudflare MOOHSIA-Apple/Upgrade-Cloud-0.4.command
      - uses: actions/upload-artifact@v4
        with:
          name: MOOHSIA-Cloud-0.4.0
          path: MOOHSIA-Cloud-0.4.0.zip

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build macOS app
        working-directory: MOOHSIA-Apple
        run: |
          chmod +x Build-Mac.command
          ./Build-Mac.command </dev/null
      - name: Package macOS app
        run: |
          APP=$(find MOOHSIA-Apple/build -name 'MOOHSIA.app' -type d | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" MOOHSIA-macOS-0.4.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MOOHSIA-macOS-0.4.0
          path: MOOHSIA-macOS-0.4.0.zip

  ios-compile-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: MOOHSIA-Apple
        run: xcodegen generate
      - name: Compile iOS simulator target
        working-directory: MOOHSIA-Apple
        run: xcodebuild -project MOOHSIA.xcodeproj -scheme MOOHSIA-iOS -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS Apple Developer project
        run: |
          zip -r MOOHSIA-iOS-0.4.0-Developer.zip \
            MOOHSIA-Apple/MOOHSIA.xcodeproj \
            MOOHSIA-Apple/iOS \
            MOOHSIA-Apple/Shared \
            MOOHSIA-Apple/project.yml \
            MOOHSIA-Apple/Prepare-iPhone.command \
            MOOHSIA-Apple/README-Apple-Developer.md
      - uses: actions/upload-artifact@v4
        with:
          name: MOOHSIA-iOS-0.4.0-Developer
          path: MOOHSIA-iOS-0.4.0-Developer.zip
